<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINGITT AI - مساعدك الذكي</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --sidebar-bg: #1e1e1e;
      --card-bg: #252525;
      --text-color: #f0f0f0;
      --accent-color: #10a37f;
      --whatsapp-color: #25D366;
      --border-color: #333;
    }
    body.light-mode {
      --bg-color: #f7f7f8;
      --sidebar-bg: #ffffff;
      --card-bg: #eaeaea;
      --text-color: #1a1a1a;
      --border-color: #ddd;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      margin: 0; background-color: var(--bg-color); color: var(--text-color);
      display: flex; height: 100vh; overflow: hidden; transition: 0.3s;
    }
    /* القائمة الجانبية */
    .sidebar {
      width: 280px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border-color);
      padding: 15px; display: flex; flex-direction: column; gap: 10px; transition: 0.3s;
    }
    .sidebar.hidden { display: none; }
    .brand { font-size: 20px; font-weight: 700; color: var(--accent-color); text-align: center; padding: 10px 0; }
    .btn {
      background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; cursor: pointer; text-align: right; font-size: 14px;
    }
    .btn:hover { opacity: 0.85; }
    .btn-whatsapp { background: var(--whatsapp-color); color: #fff; border: none; font-weight: bold; text-align: center; }
    .btn-danger { color: #ff5c5c; }
    
    /* منطقة المحادثة الرئيسية */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .header {
      padding: 12px 20px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; position: relative; }
    .msg.user { background: var(--accent-color); color: #fff; align-self: flex-start; }
    .msg.ai { background: var(--card-bg); align-self: flex-end; border: 1px solid var(--border-color); }
    .share-wa {
      display: inline-block; margin-top: 8px; font-size: 12px; color: var(--whatsapp-color);
      cursor: pointer; text-decoration: underline;
    }

    /* شريط الإدخال */
    .input-area {
      padding: 15px; border-top: 1px solid var(--border-color);
      display: flex; gap: 10px; align-items: center; background: var(--sidebar-bg);
    }
    input[type="text"], textarea, select {
      background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; outline: none;
    }
    .input-area input { flex: 1; font-size: 15px; }
    .icon-btn {
      background: var(--accent-color); color: #fff; border: none; width: 42px; height: 42px;
      border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn.secondary { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); }

    /* نافذة إعدادات الربط */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: var(--sidebar-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 450px;
      display: flex; flex-direction: column; gap: 12px;
    }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <div class="brand">CHINGITT AI</div>
    <button class="btn" onclick="newChat()">＋ محادثة جديدة</button>
    <button class="btn btn-whatsapp" onclick="openSettings()">⚙️ إعدادات مساعد الواتساب و API</button>
    
    <div style="margin-top: 10px; font-size: 13px; opacity: 0.8;">عمق الإجابة:</div>
    <select id="depthSelect">
      <option value="concise">مختصر وسريع</option>
      <option value="balanced" selected>متوازن</option>
      <option value="detailed">مفصل وعميق</option>
    </select>

    <button class="btn" onclick="toggleDarkMode()">🌓 تبديل الوضع الليلي</button>
    <button class="btn" onclick="saveChatAsFile()">💾 حفظ المحادثة كملف</button>
    <button class="btn btn-danger" onclick="clearAllChats()">🗑️ حذف كل المحادثات</button>

    <div style="margin-top: auto; font-size: 11px; opacity: 0.6; text-align: center;">
      يعمل بنموذج Claude من Anthropic.<br>محادثاتك محفوظة على جهازك فقط.
    </div>
  </div>

  <!-- الواجهة الرئيسية -->
  <div class="main">
    <div class="header">
      <button class="icon-btn secondary" onclick="toggleSidebar()">☰</button>
      <strong>CHINGITT AI</strong>
      <span id="waStatusBadge" style="font-size: 12px; color: var(--whatsapp-color);">● متصل</span>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <button class="icon-btn secondary" onclick="alert('ميزة إرفاق الملفات قيد التفعيل')">＋</button>
      <input type="text" id="userInput" placeholder="اكتب رسالتك لـ CHINGITT AI..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="icon-btn secondary" onclick="startVoice()">🎤</button>
      <button class="icon-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <!-- نافذة إعدادات الذكاء الاصطناعي وربط واتساب -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>إعدادات المساعد الشخصي</h3>
      <label style="font-size: 13px;">مفتاح Anthropic API Key:</label>
      <input type="text" id="apiKeyInput" placeholder="sk-ant-api03-...">
      
      <label style="font-size: 13px;">رابط Make.com Webhook (للتحكم في واتساب):</label>
      <input type="text" id="webhookInput" placeholder="https://make.com...">
      
      <label style="font-size: 13px;">تعليمات الرد التلقائي على رسائل الواتساب:</label>
      <textarea id="systemPromptInput" rows="3" placeholder="مثال: رد بأسلوب مهذب نيابة عني وأخبرهم أنني سأتواصل معهم قريباً..."></textarea>
      
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-whatsapp" style="flex:1;" onclick="saveSettings()">حفظ وتحديث واتساب</button>
        <button class="btn" onclick="closeSettings()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    let messages = JSON.parse(localStorage.getItem('chingitt_chat')) || [];

    function renderMessages() {
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.role}`;
        div.innerText = m.text;
        if (m.role === 'ai') {
          const waBtn = document.createElement('div');
          waBtn.className = 'share-wa';
          waBtn.innerText = '📲 إرسال هذا الرد عبر واتساب';
          waBtn.onclick = () => window.open(`https://wa.me{encodeURIComponent(m.text)}`, '_blank');
          div.appendChild(waBtn);
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      messages.push({ role: 'user', text });
      input.value = '';
      renderMessages();

      const apiKey = localStorage.getItem('chingitt_api_key');
      const depth = document.getElementById('depthSelect').value;
      const sysPrompt = localStorage.getItem('chingitt_sys_prompt') || "أنت مساعد ذكي اسمك CHINGITT AI.";

      if (!apiKey) {
        messages.push({ role: 'ai', text: '⚠️ يرجى إدخال مفتاح Anthropic API من قائمة (إعدادات مساعد الواتساب و API) لتفعيل الردود الذكية.' });
        saveAndRender();
        return;
      }

      try {
        const res = await fetch("https://anthropic.com", {
          method: "POST",
          headers: {
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "content-type": "application/json",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-3-5-sonnet-20241022",
            max_tokens: depth === 'concise' ? 300 : (depth === 'detailed' ? 2000 : 1000),
            system: sysPrompt,
            messages: [{ role: "user", content: text }]
          })
        });
        const data = await res.json();
        const reply = data.content ? data.content.text : "حدث خطأ في الاتصال بالنموذج.";
        messages.push({ role: 'ai', text: reply });
      } catch (e) {
        messages.push({ role: 'ai', text: "❌ تعذر الاتصال بالخادم، تأكد من مفتاح API والإنترنت." });
      }
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('chingitt_chat', JSON.stringify(messages));
      renderMessages();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }
    function toggleDarkMode() { document.body.classList.toggle('light-mode'); }
    function newChat() { messages = []; saveAndRender(); }
    function clearAllChats() { if(confirm('هل أنت متأكد من حذف كل المحادثات؟')) { messages = []; localStorage.removeItem('chingitt_chat'); renderMessages(); } }

    function saveChatAsFile() {
      const content = messages.map(m => `${m.role === 'user' ? 'أنت' : 'CHINGITT AI'}: ${m.text}`).join('\n\n');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'CHINGITT_AI_Chat.txt';
      a.click();
    }
