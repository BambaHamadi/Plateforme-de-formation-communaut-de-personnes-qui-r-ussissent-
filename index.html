<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10a37f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CHINGITT AI - مساعدك الشخصي الذكي</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="https://flaticon.com">
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --sidebar-bg: #1e1e1e;
      --card-bg: #252525;
      --text-color: #f0f0f0;
      --accent-color: #10a37f;
      --whatsapp-color: #25D366;
      --border-color: #333;
    }
    body.light-mode {
      --bg-color: #f7f7f8;
      --sidebar-bg: #ffffff;
      --card-bg: #eaeaea;
      --text-color: #1a1a1a;
      --border-color: #ddd;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      margin: 0; background-color: var(--bg-color); color: var(--text-color);
      display: flex; height: 100vh; overflow: hidden; transition: 0.3s;
    }
    
    /* القائمة الجانبية */
    .sidebar {
      width: 295px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border-color);
      padding: 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; transition: 0.3s;
    }
    .sidebar.hidden { display: none; }
    .brand { font-size: 21px; font-weight: 700; color: var(--accent-color); text-align: center; padding: 6px 0; }
    .section-title { font-size: 12px; color: var(--whatsapp-color); font-weight: bold; margin-top: 8px; }
    .btn {
      background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
      padding: 9px 12px; border-radius: 8px; cursor: pointer; text-align: right; font-size: 13px;
    }
    .btn:hover { opacity: 0.85; }
    .btn-whatsapp { background: var(--whatsapp-color); color: #fff; border: none; font-weight: bold; text-align: center; }
    .btn-danger { color: #ff5c5c; }
    
    /* منطقة المحادثة */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .header {
      padding: 12px 20px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; position: relative; white-space: pre-wrap; }
    .msg.user { background: var(--accent-color); color: #fff; align-self: flex-start; }
    .msg.ai { background: var(--card-bg); align-self: flex-end; border: 1px solid var(--border-color); }
    .msg img { max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; }
    .msg audio { width: 100%; margin-top: 8px; height: 35px; }
    
    .share-wa {
      display: inline-block; margin-top: 8px; font-size: 12px; color: var(--whatsapp-color);
      cursor: pointer; text-decoration: underline; font-weight: bold;
    }

    /* شريط معاينة المرفقات */
    .preview-bar {
      display: none; padding: 8px 15px; background: var(--card-bg);
      border-top: 1px solid var(--border-color); align-items: center; gap: 10px;
    }
    .preview-bar img { height: 50px; border-radius: 6px; }

    /* شريط الإدخال السفلي */
    .input-area {
      padding: 12px 15px; border-top: 1px solid var(--border-color);
      display: flex; gap: 8px; align-items: center; background: var(--sidebar-bg);
    }
    input[type="text"], textarea, select {
      background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; outline: none; width: 100%;
    }
    .input-area input[type="text"] { flex: 1; font-size: 15px; }
    .icon-btn {
      background: var(--accent-color); color: #fff; border: none; width: 42px; height: 42px;
      border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn.secondary { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); }
    .icon-btn.recording { background: #e53935; color: #fff; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* النوافذ المنبثقة */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: var(--sidebar-bg); padding: 20px; border-radius: 12px; width: 92%; max-width: 460px;
      display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <div class="brand">CHINGITT AI</div>
    <button class="btn" onclick="newChat()">＋ محادثة جديدة</button>
    
    <!-- قسم التحكم في واتساب -->
    <div class="section-title">مساعد واتساب الشخصي:</div>
    <button class="btn btn-whatsapp" id="autoReplyBtn" onclick="toggleAutoReply()">🟢 الرد على المتواصلين: مفعل</button>
    <button class="btn" onclick="openQrModal()">📷 ربط واتساب عبر مسح QR</button>
    <button class="btn" onclick="openSettings()">⚙️ إعدادات الصوت والكتابة و API</button>

    <!-- أدوات واتساب الذكية -->
    <div class="section-title">أدوات سريعة:</div>
    <button class="btn" onclick="quickPrompt('اكتب لي رسالة واتساب احترافية ومختصرة بخصوص: ')">✍️ صياغة رسالة واتساب</button>
    <button class="btn" onclick="quickPrompt('لخص لي محادثة الواتساب التالية في نقاط رئيسية:\n')">📋 تلخيص محادثة واتساب</button>
    <button class="btn" onclick="quickPrompt('ترجم هذه الرسالة بأسلوب طبيعي لإرسالها في واتساب:\n')">🌐 ترجمة رسالة واتساب</button>
    
    <div style="margin-top: 6px; font-size: 12px; opacity: 0.8;">عمق الإجابة:</div>
    <select id="depthSelect">
      <option value="concise">مختصر وسريع</option>
      <option value="balanced" selected>متوازن</option>
      <option value="detailed">مفصل وعميق</option>
    </select>

    <button class="btn" onclick="toggleDarkMode()">🌓 تبديل الوضع الليلي</button>
    <button class="btn" onclick="saveChatAsFile()">💾 حفظ المحادثة كملف</button>
    <button class="btn btn-danger" onclick="clearAllChats()">🗑️ حذف كل المحادثات</button>

    <div style="margin-top: auto; font-size: 11px; opacity: 0.6; text-align: center; padding-top: 10px;">
      CHINGITT AI - يعمل بنموذج Claude.<br>يرد بالكتابة والصوت على واتساب.
    </div>
  </div>

  <!-- الواجهة الرئيسية -->
  <div class="main">
    <div class="header">
      <button class="icon-btn secondary" onclick="toggleSidebar()">☰</button>
      <strong>CHINGITT AI</strong>
      <span id="waStatusBadge" style="font-size: 12px; color: var(--whatsapp-color);">● واتساب نشط</span>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <!-- شريط معاينة الصور والصوتيات -->
    <div class="preview-bar" id="previewBar">
      <img id="previewImg" src="" style="display:none;">
      <span id="previewText" style="font-size: 13px; flex: 1;"></span>
      <button class="btn btn-danger" style="padding: 4px 8px; width: auto;" onclick="clearAttachment()">✖ إلغاء</button>
    </div>

    <!-- شريط الإدخال -->
    <div class="input-area">
      <input type="file" id="fileInput" accept="image/*,audio/*" style="display:none;" onchange="handleFileUpload(event)">
      <button class="icon-btn secondary" title="إرفاق صورة أو ملف صوتي" onclick="document.getElementById('fileInput').click()">＋</button>
      <input type="text" id="userInput" placeholder="اكتب رسالتك أو أرفق صورة/صوت..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="icon-btn secondary" id="micBtn" title="تحدث أو سجل صوتاً" onclick="toggleVoiceRecording()">🎤</button>
      <button class="icon-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <!-- نافذة مسح رمز QR لربط واتساب -->
  <div class="modal" id="qrModal">
    <div class="modal-content" style="text-align: center;">
      <h3>ربط واتساب عبر مسح QR</h3>
      <p style="font-size: 13px; opacity: 0.8; margin: 0;">افتح واتساب في هاتفك > الأجهزة المرتبطة > ربط جهاز، ثم امسح الرمز:</p>
      
      <input type="text" id="wahaUrlInput" placeholder="رابط خادم WAHA (مثال: http://localhost:3000)">
      <button class="btn btn-whatsapp" onclick="fetchWhatsAppQR()">توليد رمز QR الآن</button>
      
      <div id="qrContainer" style="margin: 10px auto; min-height: 210px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 10px; padding: 10px;">
        <span style="color: #333; font-size: 13px;">سيظهر رمز المسح هنا</span>
      </div>

      <button class="btn" style="text-align: center;" onclick="document.getElementById('qrModal').style.display='none'">إغلاق</button>
    </div>
  </div>

  <!-- نافذة إعدادات الذكاء الاصطناعي والرد الصوتي/الكتابي -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3 style="margin: 0;">إعدادات المساعد وواتساب</h3>
      
      <label style="font-size: 13px;">مفتاح Anthropic API Key:</label>
      <input type="text" id="apiKeyInput" placeholder="sk-ant-api03-...">
      
      <label style="font-size: 13px;">رابط Make.com Webhook (للتحكم في واتساب):</label>
      <input type="text" id="webhookInput" placeholder="https://make.com...">

      <label style="font-size: 13px;">طريقة الرد على كل من يتواصل معك في واتساب:</label>
      <select id="replyModeSelect">
        <option value="text">رد كتابي فقط (نصوص ✍️)</option>
